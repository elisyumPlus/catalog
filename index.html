        body {
            background-color: #030305;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
            margin: 0;
            height: 100vh;
        }

        .sakura-bg {
            position: absolute;
            inset: 0;
            background-image: url('https://i.hizliresim.com/hprkacvl.png');
            background-size: cover;
            background-position: center;
            opacity: 0.28;
            z-index: 0;
            filter: contrast(1.05) brightness(0.85);
        }

        .glass-card {
            background: linear-gradient(145deg, rgba(22, 16, 25, 0.7) 0%, rgba(10, 8, 13, 0.85) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 183, 197, 0.12);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 183, 197, 0.35);
            box-shadow: 0 25px 50px -12px rgba(255, 183, 197, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transform: translateY(-4px);
        }

        @keyframes soft-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
        }

        .floating-container {
            animation: soft-float 7s ease-in-out infinite;
        }
    </style>

        let currentActiveModalType = null;

        function togglePreferences() {
            const popover = document.getElementById('preferencesPopover');
            if (popover.classList.contains('hidden')) {
                popover.classList.remove('hidden');
                setTimeout(() => {
                    popover.classList.remove('opacity-0', 'translate-y-2');
                }, 10);
            } else {
                popover.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    popover.classList.add('hidden');
                }, 300);
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            // Update static elements
            document.getElementById('headerBrand').textContent = t.katalog;
            document.getElementById('headerPricingText').textContent = t.pricingBtn;
            document.getElementById('moduleCodeText').textContent = t.modules.code;
            document.getElementById('moduleSocialText').textContent = t.modules.social;
            document.getElementById('moduleCameraText').textContent = t.modules.camera;
            document.getElementById('popoverTitleText').textContent = t.popoverTitle;
            document.getElementById('langTitleText').textContent = t.langTitle;
            document.getElementById('cookiesOptText').textContent = t.cookiesOpt;
            document.getElementById('cookiesBtnText').textContent = t.cookiesBtn;
            document.getElementById('modalCloseBtn').textContent = t.close;
            document.getElementById('modalSubtitle').textContent = t.modalSubtitle;

            // Highlight active lang button
            const trBtn = document.getElementById('langTrBtn');
            const enBtn = document.getElementById('langEnBtn');
            if (lang === 'tr') {
                trBtn.className = "py-1.5 px-3 rounded-xl text-xs font-medium bg-pink-500/30 text-white border border-pink-400/50 transition-all";

                enBtn.className = "py-1.5 px-3 rounded-xl text-xs font-medium bg-pink-500/30 text-white border border-pink-400/50 transition-all";
                trBtn.className = "py-1.5 px-3 rounded-xl text-xs font-medium bg-white/5 text-pink-200/80 hover:bg-white/10 border border-white/10 transition-all";
            }

            // Refresh modal if open
            if (currentActiveModalType) {
                openModal(currentActiveModalType, true);
            }

            togglePreferences();
        }

        function openModal(type, skipActiveUpdate = false) {
            if (!skipActiveUpdate) {
                currentActiveModalType = type;
            }
            const data = translations[currentLang].modalData[type];
            if (!data) return;

            document.getElementById('modalHeaderIcon').className = `fa-solid ${data.icon} text-pink-300 text-xl`;
            document.getElementById('modalTitle').textContent = data.title;
            
            const descContainer = document.getElementById('modalDescription');
            descContainer.innerHTML = '';

            if (data.type === 'pricing') {
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-1 md:grid-cols-3 gap-4 max-h-[60vh] overflow-y-auto pr-1';
                
                data.packages.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = 'glass-card p-5 rounded-2xl flex flex-col justify-between border border-pink-500/20 hover:border-pink-400/50 transition-all';
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <h4 class="font-semibold text-white text-base">${pkg.name}</h4>
                                <span class="text-pink-300 font-bold text-sm">${pkg.price}</span>
                            </div>
                            <p class="text-xs text-pink-200/70 mb-4 leading-relaxed">${pkg.desc}</p>
                            <ul class="space-y-2 mb-6">
                                ${pkg.features.map(f => `<li class="text-[11px] text-pink-100/90 flex items-center space-x-2"><i class="fa-solid fa-check text-pink-400 text-[10px]"></i><span>${f}</span></li>`).join('')}
                            </ul>
                        </div>
                        <a href="https://wa.me/905510908382?text=Merhaba,%20${encodeURIComponent(pkg.name)}%20paketi%20hakkında%20bilgi%20almak%20istiyorum." target="_blank" rel="noopener noreferrer" class="w-full py-2.5 rounded-xl bg-pink-500/20 hover:bg-pink-500/30 text-pink-200 text-xs font-medium text-center transition-all border border-pink-500/30">
                            ${translations[currentLang].getInfo}
                        </a>
                    `;
                    grid.appendChild(card);
                });
                descContainer.appendChild(grid);
            } else if (data.type === 'text') {
                const p = document.createElement('p');
                p.className = 'text-pink-100/90 text-sm md:text-base leading-relaxed';
                p.textContent = data.content;
                descContainer.appendChild(p);
            } else {
                const ul = document.createElement('ul');
                ul.className = 'space-y-3.5';
                data.points.forEach(point => {
                    const li = document.createElement('li');
                    li.className = 'flex items-start space-x-3 text-pink-100/90';
                    li.innerHTML = `<span class="inline-block w-1.5 h-1.5 rounded-full bg-pink-400 mt-2 flex-shrink-0 shadow-[0_0_8px_rgba(244,114,182,0.8)]"></span><span>${point}</span>`;
                    ul.appendChild(li);
                });
                descContainer.appendChild(ul);
            }

            const modal = document.getElementById('infoModal');
            const container = document.getElementById('modalContainer');

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.classList.add('opacity-100', 'pointer-events-auto');
            container.classList.remove('scale-95');
            container.classList.add('scale-100');
        }

        function closeModal() {
            currentActiveModalType = null;
            const modal = document.getElementById('infoModal');
            const container = document.getElementById('modalContainer');

            modal.classList.remove('opacity-100', 'pointer-events-auto');
            modal.classList.add('opacity-0', 'pointer-events-none');
            container.classList.add('scale-95');
        }

        document.getElementById('infoModal').addEventListener('click', (e) => {
            if (e.target.id === 'infoModal') {
                closeModal();
            }
        });

        // Sakura particle canvas animation
        const canvas = document.getElementById('sakuraCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Petal {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * window.innerWidth;
                this.y = -20;
                this.size = Math.random() * 6 + 3;
                this.speedY = Math.random() * 0.8 + 0.3;
                this.speedX = Math.sin(this.y * 0.01) * 0.8;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 1.5 - 0.75;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y += this.speedY;
                this.x += this.speedX + Math.sin(this.y * 0.015) * 0.5;
                this.rotation += this.rotationSpeed;
                if (this.y > window.innerHeight + 20) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = `rgba(255, 183, 197, ${this.opacity})`;
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const petalsCount = 45;
        const petals = [];
        for (let i = 0; i < petalsCount; i++) {
            const p = new Petal();
            p.y = Math.random() * window.innerHeight;
            petals.push(p);
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
